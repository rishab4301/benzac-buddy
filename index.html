<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benzac Buddy Prototype</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        benzac: {
                            purple: '#6b21a8',
                            light: '#f3e8ff',
                            dark: '#3b0764',
                            whatsapp: '#25D366',
                            chatbg: '#efeae2'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .chat-bg {
            background-color: #efeae2;
            background-image: url('https://w0.peakpx.com/wallpaper/818/148/HD-wallpaper-whatsapp-background-cool-dark-green-new-theme-whatsapp.jpg');
            background-size: cover;
            background-blend-mode: overlay;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Mobile phone container simulation */
        .phone-container {
            width: 100%;
            height: 100%;
            max-width: 420px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: white;
            display: flex;
            flex-direction: column;
        }
        @media (min-width: 640px) {
            .phone-container {
                height: 850px;
                max-height: 90vh;
                border-radius: 2rem;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
                border: 8px solid #1f2937;
            }
        }
    </style>
</head>
<body class="bg-gray-200 h-screen w-screen overflow-hidden flex justify-center items-center">
    <div id="root" class="w-full h-full md:py-8 flex justify-center items-center"></div>
    <script type="text/babel" src="app.jsx"></script>
</body>
</html>
